# configs/e2e_windaware.yaml

airsim:
  ip: "127.0.0.1"
  vehicle_name: "Drone1"
output:
  dir: "outputs"
  flight_png: "flight_data.png"

goal:
  # NED: [x, y, z]  (z is negative for above ground in NED)
  ned: [20, 3, -3.0]
  goal_reached_m: 2.0

  # YOPO goal shaping
  yopo_goal_length: 10.0
  subgoal_radius: 8.0

perception:
  # Depth output size used by YOPO
  image_height: 96
  image_width: 160
  depth_max_m: 20.0

  # AirSim camera name/index used in ImageRequest
  camera_name: "0"

  # show depth window (requires opencv-python)
  depth_visualize: true

yopo:
  # your YOPO repo dir + checkpoint
  yopo_dir: "E:\\wind-aware-main\\YOPO"
  checkpoint_path: "E:\\wind-aware-main\\YOPO\\saved\\YOPO_1\\epoch50.pth"

  # trajectory segment time used by desired_velocity_at_lookahead()
  segment_time: 1.7

  # NOTE: current YOPOPlanner.plan() in your code still uses argmin(score) internally.
  # Keeping this for future compatibility if you later wire it through.
  score_mode: "min"

control:
  dt: 0.10
  command_duration_s: 0.35

  # speed limits
  max_vel_xy: 4.0
  max_vel_norm: 6.0

  # altitude hold
  target_z_ned: -3.0

  # YOPO polytraj lookahead
  trajectory_lookahead_s: 0.20

shield:
  enable: true

  # limits / nominal
  max_vel_xy: 4.0
  target_z_ned: -3.0
  depth_max_m: 20.0

  # basic distances
  safety_slow_depth_m: 2.8
  safety_stop_depth_m: 1.2
  safety_climb_m: 0.8

  # robust mins (quantiles)
  q_left: 0.03
  q_center: 0.03
  q_right: 0.03
  q_global: 0.01

  # anti-oscillation (direction stickiness)
  shield_hold_steps: 12
  shield_dir_gap_m: 0.6
  shield_emergency_vy: 1.2

  # lateral repulsion
  shield_repulse_ref_m: 3.0
  shield_k_rep: 1.0
  shield_vy_cap: 1.0
  shield_alpha: 0.85

  # speed scaling
  shield_min_scale: 0.30
  shield_slow_d: 2.8
  shield_stop_d: 1.2

  # corridor mode (both sides close, front clear)
  corridor_left_right_m: 2.5
  corridor_front_clear_m: 4.0
  shield_corridor_vy_mul: 0.35
  shield_corridor_vx_mul: 0.55

  # split regions (image width fractions)
  left_x1: 0.33
  center_x0: 0.40
  center_x1: 0.60
  right_x0: 0.67

wind:
  enable: true
  # must exist in envs/wind_profiles.py -> PROFILES_ALL
  profile: "0mps"
  dt: 0.02

metapinn:
  enable: true

  model:
    mp_load: "E:\\wind-aware-main\\Meta-PINN\\saved_models\\meta_pinn_offline\\meta_pinn_best.pth"
    mp_scaler: "E:\\wind-aware-main\\Meta-PINN\\saved_models\\meta_pinn_offline\\x_scaler.npz"

    # IMPORTANT: must match offline training exactly (order & dimensions)
    feature_keys: "v,q,pwm"

  fusion:
    # IMPORTANT:
    # You documented: v_cmd = v_yopo - k_ff*(fhat/m)*dt
    # Patch runner uses: dv = (+k_ff)*(fhat/m)*dt
    # So to keep the "-" compensation effect, set k_ff negative here.
    type: "vel_ff"
    k_ff: -0.35
    max_delta_v: 1.2
    cond_from: "speed"

  online:
    enable: false
    lr: 0.001
    update_every: 10


visualize:
  enable: true
  depth_scale: 1
  topk: 8
  traj_points: 20     # 每条轨迹采样点数
  cam_fov_deg: 90.0   # 仅用于叠加显示

debug:
  print_each_step: false
